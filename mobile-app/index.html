<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ae8040" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>انگلینڈ آرڈرز</title>
    <script>
      // Apply the saved theme before the first paint (no light flash in dark mode).
      try {
        var t = localStorage.getItem('eo.theme');
        var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
