<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons: SVG for modern browsers, PNG/ICO fallbacks, Apple + PWA icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#241910" />
    <meta
      name="description"
      content="England — Pakistan ka apna FMCG wholesale partner. Tissue, agarbatti, razor, hair color, soap aur har roz ki zaroorat ka saaman, dukaandaron ke liye thok rate par. 40+ cities mein agle din delivery."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Admin inventory page (reference "Master Stock Inventory" design) -->
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800,900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>England — Har Dukaan Ka Poora Saaman | FMCG Wholesale</title>

    <!-- =====================================================================
         THE OPENING — full-screen brand loader.

         WHY IT LIVES IN index.html AND NOT IN REACT. A loader that ships inside
         the bundle cannot cover the thing it exists to cover: it only appears
         once the bundle has downloaded, parsed and mounted, which on a cold
         connection is most of the wait. Markup, styles and controller are all
         inline in the document, so the FIRST paint the browser makes is already
         the loader — there is no moment where the page shows through.

         It also means every entry point is covered for free. The app is a
         HashRouter SPA, so `/#/products`, `/#/admin`, a refresh and a pasted
         deep link all serve THIS document; the loader is on the route because
         it is on the file.

         THE COMPOSITION, top to bottom:

             a gold bloom, breathing slowly behind everything
             the ENGLAND wordmark, wiped in behind a travelling gold hairline
             the progress rule — drawn open from its centre, then filled
             the tagline, arriving a letter at a time
             the footer: englandwaly.com · crafted by Codelps

         Every one of those is a flat fill on flat colour. #241910 is the
         existing <meta name="theme-color">, so the browser chrome continues the
         panel instead of drawing a line above it; cream #F6F0E4 and gold
         #B98F43 / #CBA45C are --cream / --gold / --gold-2 from theme.css.

         IT MUST NEVER BE THE SLOW PART. Two mechanisms keep that honest: the
         readout is pinned to milestones the document really reaches (see the
         controller), and a visitor who has been here before gets the same
         sequence at roughly half the duration — by their second visit the
         service worker has the bundle on disk, so a leisurely entrance would be
         the only thing left to wait for. `--d-*` below are what `is-warm`
         shortens; nothing else changes, so the two speeds cannot drift apart.
         ===================================================================== -->
    <link rel="preload" as="image" fetchpriority="high" href="/england-loader-mark.webp" />
    <style>
      /* Locked while the loader is up, released the instant it leaves. Not
         `overflow-x`, which index.css sets to `clip` on <html> — this is a
         temporary inline-weight lock and it is removed, so the stylesheet's
         own rule takes back over untouched. */
      html.eng-booting {
        overflow: hidden;
      }

      .eng-load {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #241910;
        /* The exit wipe. Declared here so the transition has a start value to
           leave from; without it the first frame of the hand-off jumps. */
        clip-path: inset(0 0 0 0);
        transition: clip-path 700ms cubic-bezier(0.76, 0, 0.24, 1) 110ms;

        /* The mark's width, named once: the stage is built around it — the
           progress row is exactly this wide — and two hand-copied responsive
           expressions drift apart the moment one of them is edited. */
        --eng-mark-w: min(72vw, 27rem);

        /* The three durations the whole sequence is built from. */
        --d-mark: 940ms; /* the wordmark unveil, and the hairline riding it */
        --d-rise: 800ms; /* anything that travels into place */
        --d-fade: 500ms; /* anything that simply appears */
      }

      /* A returning visitor. Same sequence, roughly half the time — see the
         note above. */
      .eng-load.is-warm {
        --d-mark: 540ms;
        --d-rise: 460ms;
        --d-fade: 290ms;
      }

      /* Depth without a gradient doing the talking: one warm bloom behind the
         mark and one darkening at the floor, both very low contrast. It
         breathes on a long cycle, which is what stops a panel of static type
         from reading as a frozen screenshot while a slow request finishes. */
      .eng-load__bloom {
        position: absolute;
        inset: 0;
        opacity: 0;
        background:
          radial-gradient(58% 44% at 50% 43%, rgba(185, 143, 67, 0.23), rgba(185, 143, 67, 0) 72%),
          radial-gradient(130% 88% at 50% 122%, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0) 62%);
        transition: opacity 900ms ease-out;
      }

      .eng-load.is-armed .eng-load__bloom {
        opacity: 1;
        animation: eng-load-breathe 5600ms ease-in-out 900ms infinite;
      }

      @keyframes eng-load-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.82;
        }
        50% {
          transform: scale(1.07);
          opacity: 1;
        }
      }

      /* Held a little above the true centre. An object centred in the window
         reads as sitting low, and the footer needs the floor to itself. */
      .eng-load__stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(15px, 2.6vh, 26px);
        margin-block-end: clamp(20px, 6vh, 56px);
        padding-inline: clamp(20px, 6vw, 64px);
        transition: transform 560ms cubic-bezier(0.22, 1, 0.36, 1), opacity 380ms ease-out;
      }

      .eng-load__mark {
        position: relative;
        inline-size: var(--eng-mark-w);
        aspect-ratio: 620 / 306;
      }

      /* THE UNVEIL. The wordmark is wiped in left-to-right while it rises and
         settles out of a fractional scale — one gesture, three properties, all
         of them compositor-friendly so a busy main thread cannot stutter it.
         It starts from `inset(0 100% 0 0)`: fully clipped away, not hidden, so
         there is nothing to un-hide and no flash of a finished logo first. */
      .eng-load__mark img {
        display: block;
        inline-size: 100%;
        block-size: 100%;
        object-fit: contain;
        opacity: 0;
        transform: translateY(12px) scale(0.974);
        clip-path: inset(0 100% 0 0);
      }

      .eng-load.is-armed .eng-load__mark img {
        opacity: 1;
        transform: none;
        clip-path: inset(0 0 0 0);
        transition: opacity var(--d-fade) ease-out,
          transform var(--d-rise) cubic-bezier(0.16, 1, 0.3, 1),
          clip-path var(--d-mark) cubic-bezier(0.76, 0, 0.24, 1);
      }

      /* The gold hairline that rides the leading edge of that wipe. It carries
         the same easing and duration as the clip, so it stays welded to the
         edge rather than racing it, and it is gone by the time the mark is
         whole — the detail is the reveal, not a decoration left on screen. */
      .eng-load__scan {
        position: absolute;
        inset-block: -7%;
        inset-inline-start: 0;
        inline-size: 2px;
        background: #b98f43;
        opacity: 0;
      }

      .eng-load.is-armed .eng-load__scan {
        animation: eng-load-scan var(--d-mark) cubic-bezier(0.76, 0, 0.24, 1) forwards;
      }

      @keyframes eng-load-scan {
        0% {
          opacity: 0;
          transform: translateX(0);
        }
        14% {
          opacity: 1;
        }
        84% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(calc(var(--eng-mark-w) - 2px));
        }
      }

      /* THE PROGRESS ROW — the rule and the figure that agree with it, exactly
         as wide as the wordmark above them. Keeping the two welded to the mark
         rather than parking a bar at the bottom of the window is the whole
         difference between a brand opening and a browser chrome imitation. */
      .eng-load__meter {
        display: flex;
        align-items: center;
        gap: clamp(12px, 2.2vw, 20px);
        inline-size: var(--eng-mark-w);
        opacity: 0;
        transition: opacity var(--d-fade) ease-out 150ms;
      }

      .eng-load.is-armed .eng-load__meter {
        opacity: 1;
      }

      /* Drawn open from its own centre as it arrives, then filled from the
         left. Two transforms on two elements, so neither has to undo the other. */
      .eng-load__rule {
        position: relative;
        flex: 1 1 auto;
        min-inline-size: 0;
        block-size: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(246, 240, 228, 0.13);
        transform: scaleX(0.05);
        transform-origin: center;
        transition: transform var(--d-rise) cubic-bezier(0.16, 1, 0.3, 1) 190ms;
      }

      .eng-load.is-armed .eng-load__rule {
        transform: scaleX(1);
      }

      .eng-load__rule i {
        display: block;
        block-size: 100%;
        background: #b98f43;
        transform: scaleX(var(--eng-p, 0));
        transform-origin: left center;
        /* No transition: --eng-p is already an exponentially smoothed value
           written once per frame, so a second easing on top of it would only
           make the rule lag behind the figure it is supposed to agree with. */
      }

      /* A highlight travelling the track, under no circumstances a fake
         progress bar — it carries no information and is not tied to the
         number. It exists because the readout is HONEST and an honest readout
         sometimes sits still for a second on a slow connection, and a panel
         with nothing moving on it reads as crashed. */
      .eng-load__rule::after {
        content: '';
        position: absolute;
        inset-block: 0;
        inline-size: 36%;
        background: linear-gradient(
          90deg,
          rgba(246, 240, 228, 0),
          rgba(246, 240, 228, 0.45),
          rgba(246, 240, 228, 0)
        );
        transform: translateX(-130%);
      }

      .eng-load.is-armed .eng-load__rule::after {
        animation: eng-load-sheen 2100ms cubic-bezier(0.45, 0, 0.25, 1) 760ms infinite;
      }

      @keyframes eng-load-sheen {
        to {
          transform: translateX(400%);
        }
      }

      .eng-load__pct {
        flex: none;
        min-inline-size: 3.7em;
        text-align: end;
        /* A SYSTEM STACK ON PURPOSE, here and on the tagline and the footer.
           Bricolage and Plus Jakarta are still downloading while this is on
           screen, and type that changes shape halfway through the animation is
           worse than type that never had a face of its own. */
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: clamp(10px, 1.4vw, 12px);
        font-weight: 700;
        letter-spacing: 0.08em;
        color: rgba(246, 240, 228, 0.92);
        /* Tabular figures, or the counter twitches sideways on every tick. */
        font-variant-numeric: tabular-nums;
      }

      /* The tagline arrives a letter at a time — the one signature move, put on
         the line that can carry it without seams. Delays are stamped per span
         by the controller. */
      .eng-load__tag {
        margin: 0;
        max-inline-size: min(100%, 30rem);
        text-align: center;
        text-transform: uppercase;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: clamp(8.5px, 1.4vw, 11px);
        font-weight: 600;
        line-height: 1.9;
        letter-spacing: 0.4em;
        text-indent: 0.4em; /* balances the trailing letter-space */
        color: #cba45c;
      }

      /* Every letter is its own box so it can be animated on its own delay —
         which also means the line can break between ANY two of them. The word
         wrapper is what stops that: breaks are only allowed at the spaces
         between wrappers, so a narrow screen wraps "HAR DUKAAN KA / POORA
         SAAMAN" instead of "HAR DUKAAN K / A POORA SAAM / AN". */
      .eng-load__tag .w {
        display: inline-block;
        white-space: nowrap;
      }

      .eng-load__tag .l {
        display: inline-block;
        opacity: 0;
        transform: translateY(0.8em);
        transition: opacity var(--d-fade) ease-out,
          transform var(--d-rise) cubic-bezier(0.16, 1, 0.3, 1);
      }

      .eng-load.is-armed .eng-load__tag .l {
        opacity: 1;
        transform: none;
      }

      /* The footer line: whose shop this is, and who built it. Sized and
         tracked to sit well below the stage in the reading order — it is a
         colophon, not a second headline. */
      .eng-load__foot {
        position: absolute;
        inset-inline: clamp(18px, 5vw, 48px);
        inset-block-end: calc(clamp(18px, 3.2vh, 34px) + env(safe-area-inset-bottom, 0px));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: clamp(8px, 1.15vw, 10px);
        font-weight: 600;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(246, 240, 228, 0.4);
        opacity: 0;
        transition: opacity var(--d-fade) ease-out 400ms;
      }

      .eng-load.is-armed .eng-load__foot {
        opacity: 1;
      }

      .eng-load__foot span {
        display: inline-flex;
        align-items: center;
        gap: 0.7em;
        white-space: nowrap;
      }

      .eng-load__foot i {
        inline-size: 3px;
        block-size: 3px;
        border-radius: 50%;
        background: #b98f43;
      }

      .eng-load__foot b {
        font-weight: inherit;
      }

      /* Narrow phones: the two ends of the footer would otherwise meet in the
         middle. Tracking comes in first, and "Crafted" is the word that goes —
         the two names are the part that matters. */
      @media (max-width: 420px) {
        .eng-load__foot {
          gap: 8px;
          font-size: 8px;
          letter-spacing: 0.16em;
        }
        .eng-load__foot b {
          display: none;
        }
      }

      /* THE HAND-OFF. The stage lifts and fades first, then the loader itself
         is wiped away from the top down — so the navbar and the hero are the
         first things uncovered, and the page arrives the way it is read. */
      .eng-load[data-state='out'] {
        clip-path: inset(100% 0 0 0);
        pointer-events: none;
      }

      .eng-load[data-state='out'] .eng-load__stage {
        transform: translateY(-2rem);
        opacity: 0;
        transition: transform 400ms cubic-bezier(0.7, 0, 0.84, 0), opacity 240ms ease-in;
      }

      /* `animation: none` is load-bearing on both of these: a transition cannot
         override a running animation, so the breathing bloom and the travelling
         sheen would otherwise keep their own opacity all the way through the
         exit and be cut off mid-cycle by the wipe. */
      .eng-load[data-state='out'] .eng-load__bloom,
      .eng-load[data-state='out'] .eng-load__rule::after {
        animation: none;
        opacity: 0;
        transition: opacity 220ms ease-out;
      }

      .eng-load[data-state='out'] .eng-load__meter,
      .eng-load[data-state='out'] .eng-load__foot {
        opacity: 0;
        transition: opacity 240ms ease-out;
      }

      /* Short viewports (landscape phones) — the mark has to give way first. */
      @media (max-height: 520px) {
        .eng-load {
          --eng-mark-w: min(50vw, 19rem);
        }
        .eng-load__stage {
          margin-block-end: clamp(10px, 3vh, 22px);
          gap: clamp(10px, 2.2vh, 18px);
        }
        .eng-load__foot {
          inset-block-end: calc(10px + env(safe-area-inset-bottom, 0px));
        }
      }

      /* Travel removed, progress kept. The level is the load and not a
         flourish, so it still moves — it simply arrives instead of sweeping. */
      @media (prefers-reduced-motion: reduce) {
        .eng-load *,
        .eng-load *::after,
        .eng-load {
          animation: none !important;
        }
        .eng-load__scan,
        .eng-load__rule::after {
          display: none;
        }
        .eng-load__bloom {
          opacity: 1;
        }
        .eng-load__mark img {
          clip-path: none;
          transform: none;
        }
        .eng-load.is-armed .eng-load__mark img {
          transition: opacity 200ms linear;
        }
        .eng-load__rule {
          transform: none;
          transition: none;
        }
        .eng-load__tag .l {
          transform: none;
          transition: opacity 200ms linear;
        }
        .eng-load[data-state='out'] {
          clip-path: none;
          opacity: 0;
          transition: opacity 260ms linear;
        }
        .eng-load[data-state='out'] .eng-load__stage {
          transform: none;
        }
      }
    </style>
    <script>
      // The scroll lock goes on before the body exists, so there is never a
      // frame where the page behind the loader can be scrolled or seen.
      document.documentElement.classList.add('eng-booting');
    </script>
    <noscript>
      <style>
        /* Nothing can dismiss the loader without JS, so it must never appear. */
        .eng-load {
          display: none !important;
        }
        html.eng-booting {
          overflow: visible;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- FIRST IN THE BODY, before the mount point. This is what the browser
         paints while the bundle is still coming down, so it has to be markup in
         the document rather than a component inside it. -->
    <div
      class="eng-load"
      id="eng-load"
      role="status"
      aria-live="polite"
      aria-label="Loading England"
    >
      <div class="eng-load__bloom" aria-hidden="true"></div>

      <div class="eng-load__stage">
        <div class="eng-load__mark">
          <img
            id="eng-load-mark"
            src="/england-loader-mark.webp"
            width="620"
            height="306"
            alt="England"
            fetchpriority="high"
            decoding="async"
            draggable="false"
          />
          <i class="eng-load__scan" aria-hidden="true"></i>
        </div>

        <div class="eng-load__meter" aria-hidden="true">
          <span class="eng-load__rule"><i></i></span>
          <span class="eng-load__pct" id="eng-load-pct">0&thinsp;%</span>
        </div>

        <p class="eng-load__tag" id="eng-load-tag" aria-hidden="true">
          Har Dukaan Ka Poora Saaman
        </p>
      </div>

      <div class="eng-load__foot" aria-hidden="true">
        <span>englandwaly.com</span>
        <span><i></i><b>Crafted&nbsp;</b>by Codelps</span>
      </div>
    </div>

    <script>
      /*
       * THE CONTROLLER.
       *
       * The number is real. It is not a timer counting to a hundred while the
       * page does whatever it is doing — it is pinned to milestones the
       * document actually reaches, and it waits at each one until the next
       * arrives:
       *
       *     the document parsed        →  30
       *     the web fonts resolved     →  52
       *     every subresource loaded   →  70
       *     React's first commit       →  88
       *     the first screen is up     → 100
       *
       * Between two milestones it creeps a fraction of the remaining distance
       * per frame, so it always moves and can never overtake the thing it is
       * reporting. That asymptote is the whole trick: the readout is honest
       * and it never sits still.
       *
       * TWO GUARANTEES, pulling in opposite directions. A load that finishes
       * instantly still plays the entrance, because a loader that flashes is
       * worse than no loader. A load that never finishes is dismissed at
       * MAX_MS regardless — this thing covers the entire site, and a hung
       * request must never be able to hold the door shut.
       */
      (function () {
        var el = document.getElementById('eng-load');

        if (!el) return;

        var root = document.documentElement;
        var img = document.getElementById('eng-load-mark');
        var pctEl = document.getElementById('eng-load-pct');
        var tagEl = document.getElementById('eng-load-tag');

        /*
         * HAS THIS BROWSER BEEN HERE BEFORE?
         *
         * The floors below exist so a fast load is not a flash. On a FIRST
         * visit that is worth the time — it is the brand's one opening, and the
         * network is genuinely busy behind it anyway. On every visit after
         * that, the service worker has the bundle and the fonts on disk and the
         * app is ready in a few hundred milliseconds, at which point a
         * cinematic floor is no longer covering a wait: it IS the wait. So the
         * returning visitor gets the same sequence, played at roughly half
         * length, and the CSS reads `is-warm` for exactly the same reason.
         *
         * The flag is written when the loader COMPLETES, not when it starts, so
         * a first visit that was abandoned or failed still gets a proper
         * opening on the next attempt.
         */
        var WARM = false;

        try {
          WARM = localStorage.getItem('eng.seen') === '1';
        } catch (e) {
          // Private mode, or storage blocked. Falls through as a first visit,
          // which is the safe direction to be wrong in.
        }

        var MIN_MS = WARM ? 360 : 760; // floor on the whole appearance
        var ENTER_MS = WARM ? 520 : 820; // the entrance, once it has really started
        var HOLD_MS = WARM ? 170 : 340; // the beat the readout needs to land on 100
        var ARM_MS = 900; // longest the entrance will wait on the wordmark
        var MAX_MS = 6000; // hard ceiling, whatever else happens

        var began = Date.now();
        var armedAt = 0;
        var ceiling = 6; // where the creep is currently allowed to reach
        var shown = 0; // what the readout is displaying
        var printed = -1;
        var mounted = false;
        var loaded = document.readyState === 'complete';
        var done = false;
        var frame = 0;
        var lastFrame = 0;

        if (WARM) el.classList.add('is-warm');

        // The tagline arrives a letter at a time. Split here rather than in the
        // markup so the copy stays one readable string to edit; the spans are
        // in place before the first paint either way, because this script is
        // parser-blocking and sits directly under the element.
        (function () {
          var words = tagEl.textContent.trim().split(/\s+/);
          var lead = WARM ? 300 : 520;
          var step = WARM ? 14 : 24;
          var n = 0;

          tagEl.textContent = '';

          for (var w = 0; w < words.length; w++) {
            // Letters are individually animated, which means a line may break
            // between ANY two of them. Each word gets a wrapper so the only
            // legal break points are the spaces between words — otherwise a
            // narrow screen wraps "HAR DUKAAN K / A POORA SAAM / AN".
            var word = document.createElement('span');

            word.className = 'w';

            for (var i = 0; i < words[w].length; i++) {
              var letter = document.createElement('span');

              letter.className = 'l';
              letter.textContent = words[w].charAt(i);
              letter.style.transitionDelay = lead + n++ * step + 'ms';
              word.appendChild(letter);
            }

            tagEl.appendChild(word);

            if (w < words.length - 1) {
              tagEl.appendChild(document.createTextNode(' '));
            }
          }
        })();

        // The wordmark is a file like any other, and the entrance waits for it
        // rather than wiping in an empty box. The wait is capped: a mark that
        // never lands must not cost the visitor the whole animation.
        function arm() {
          if (armedAt) return;
          armedAt = Date.now();
          el.classList.add('is-armed');
        }

        if (img.complete && img.naturalWidth) {
          arm();
        } else {
          img.addEventListener('load', arm);
          img.addEventListener('error', function () {
            // The optimised mark is a derived file. If it is ever missing, fall
            // back to the wordmark the navbar already ships — resolved against
            // the document so a sub-folder deploy still finds it.
            if (img.getAttribute('data-fallback')) {
              arm();
              return;
            }

            img.setAttribute('data-fallback', '1');
            img.src = new URL('england-logo-nav.png', document.baseURI).href;
          });
        }

        window.setTimeout(arm, ARM_MS);

        function paint(now) {
          /* THE CREEP IS INTEGRATED AGAINST TIME, NOT COUNTED PER FRAME.
             Parsing and executing the bundle blocks the main thread for
             hundreds of milliseconds at precisely the moment the milestones
             are landing, so requestAnimationFrame stops firing there. A
             per-frame creep spends that whole stall standing still and then
             crawls out of it on the handful of frames it gets — the readout
             sat at 15 % with the site already mounted behind it. Advancing by
             the time that actually elapsed means it comes back from a stall
             where the clock says it should be. */
          var dt = lastFrame ? Math.min((now - lastFrame) / 1000, 0.5) : 0;

          // First frame: the loader itself is now on screen. That is a real
          // milestone and it keeps the readout off a suspiciously low number
          // during the gap before the document finishes parsing.
          if (!lastFrame) reach(16);

          lastFrame = now;

          var target = done ? 100 : ceiling;
          var rate = done ? 7 : 4.5; // how fast it closes the gap, per second

          shown += (target - shown) * (1 - Math.exp(-rate * dt));

          if (done && target - shown < 0.4) shown = target;

          el.style.setProperty('--eng-p', (shown / 100).toFixed(4));

          var whole = Math.round(shown);

          if (whole !== printed) {
            printed = whole;
            pctEl.textContent = whole + ' %';
          }

          frame = window.requestAnimationFrame(paint);
        }

        function reach(value) {
          if (value > ceiling) ceiling = value;
        }

        function finish() {
          if (done) return;
          done = true;

          // Recorded here rather than at boot: a first visit that was abandoned
          // or that failed halfway still deserves a real opening next time.
          try {
            localStorage.setItem('eng.seen', '1');
          } catch (e) {
            /* nothing to do — next visit simply plays the full entrance */
          }

          var now = Date.now();
          // Hold long enough that the appearance is never a flash AND that the
          // entrance, whenever it managed to start, is allowed to complete.
          var wait =
            Math.max(
              MIN_MS - (now - began),
              ENTER_MS - (now - (armedAt || began)),
              0
            ) + HOLD_MS;

          window.setTimeout(function () {
            el.setAttribute('data-state', 'out');
            root.classList.remove('eng-booting');

            window.setTimeout(function () {
              window.cancelAnimationFrame(frame);
              if (el.parentNode) el.parentNode.removeChild(el);
            }, 950);
          }, wait);
        }

        if (document.readyState !== 'loading') {
          reach(30);
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            reach(30);
          });
        }

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            reach(52);
          });
        } else {
          reach(52);
        }

        if (!loaded) {
          window.addEventListener('load', function () {
            loaded = true;
            reach(70);
            if (mounted) finish();
          });
        } else {
          reach(70);
        }

        window.__engLoader = {
          reach: reach,

          /* The last milestone is the application's to report. <App> calls this
             once React has committed its first render, which is the moment the
             real page exists behind the loader — the site is ready when its
             first screen is drawn, not when its scripts have merely parsed. */
          ready: function () {
            if (mounted) return;
            mounted = true;
            reach(88);

            // Assets the first screen wants may still be in flight. Hand over
            // on `load`, or after a short grace if that tail runs long: a
            // below-the-fold image finishing is not worth another second of
            // dark screen.
            if (loaded) finish();
            else window.setTimeout(finish, WARM ? 420 : 700);
          },
        };

        // If the bundle never boots at all, the site still opens.
        window.setTimeout(finish, MAX_MS);

        frame = window.requestAnimationFrame(paint);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
