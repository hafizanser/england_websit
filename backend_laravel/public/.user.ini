; ===========================================================================
; PHP limits for the England API docroot.
;
; WHY THIS FILE EXISTS
; ---------------------------------------------------------------------------
; Nothing in this repo used to set these, so the API ran on whatever the host
; defaults to. On cPanel that is commonly upload_max_filesize = 2M and
; post_max_size = 8M — fine for a product photo, and far too small for the
; product video the dashboard now uploads. A body over post_max_size is thrown
; away by PHP BEFORE Laravel sees it: $_POST and $_FILES arrive empty, so the
; save looks like it worked and silently drops the clip, or the web server
; answers 413 and the admin gets an error with no way to act on it.
;
; max_execution_time matters just as much and for a different reason: the API
; re-encodes an uploaded clip with ffmpeg (App\Support\VideoStorage) before it
; answers. At the usual 30 s default, a minute of 1080p footage is killed
; mid-transcode and returns a 500.
;
; HOW IT IS READ
; ---------------------------------------------------------------------------
; `.user.ini` is honoured by PHP running as CGI/FastCGI/PHP-FPM, which is how
; cPanel serves PHP. It must sit in the DOCUMENT ROOT — which for this app is
; `england_api/public` (see DEPLOYMENT.md step 4), i.e. exactly here. Values are
; cached for `user_ini.cache_ttl` seconds (300 by default), so a change can take
; five minutes or a PHP restart to take effect.
;
; If the host disallows per-directory overrides these lines are ignored rather
; than fatal, and the limits stay whatever the host set — so this is safe to
; ship, but NOT a guarantee. If big uploads still fail after deploying, set the
; same four values in cPanel → MultiPHP INI Editor, which always wins.
;
; THE NUMBERS
; ---------------------------------------------------------------------------
; post_max_size is deliberately LARGER than upload_max_filesize: the request
; body is the file plus every other form field plus multipart framing, and if
; post_max_size were the smaller of the two it would be the real ceiling.
;
; The headroom is for the case the browser could NOT re-encode the clip itself
; (src/lib/videoCompress.js falls back to the original for an undecodable
; container such as a ProRes .MOV). A compressed clip is a few MB; this ceiling
; only has to catch the untouched original, and 64M sat right on top of the very
; file size that exposed the problem.
; ===========================================================================

upload_max_filesize = 96M
post_max_size = 104M

; Long enough for ffmpeg to transcode a short product clip on shared hosting.
; This bounds the SERVER's work only; the browser's own patience is handled in
; src/api/http.js, which watches for a stall rather than a total duration.
max_execution_time = 300
max_input_time = 300

; ffmpeg is run as a separate process, so this covers PHP moving the uploaded
; file around rather than the encode itself.
memory_limit = 256M
