name: Deploy to Bluehost (englandwaly)

# Builds the React frontend, then rsyncs the build + backend PHP code over SSH
# into the public_html/englandwaly folder.
#
# It is SAFE by design — it NEVER touches:
#   • the live database            • api_app/.env
#   • api_app/uploads (images/videos)  • api_app/vendor (Composer deps)
#   • api_app/storage (logs/sessions)  • the /videos folder
#
# Composer install and DB migrations are intentionally NOT run here. If you ever
# change composer.json/lock or add a migration, do that step manually once over
# SSH:  cd api_app && composer install --no-dev -o   /   php artisan migrate --force
#
# ---- One-time setup: GitHub -> repo Settings -> Secrets and variables ->
#      Actions -> New repository secret ----
#   SSH_HOST         e.g.  box1234.bluehost.com   (or server hostname/IP)
#   SSH_USER         your cPanel username          (e.g. codelpsc)
#   SSH_PORT         SSH port                       (Bluehost is usually 22)
#   SSH_PRIVATE_KEY  the PRIVATE key whose public key is authorized in
#                    cPanel -> SSH Access -> Manage SSH Keys (full key text)
#   DEPLOY_PATH      absolute path to the folder,
#                    e.g.  /home1/codelpsc/public_html/englandwaly
#
# ---- ONE SSH CONNECTION PER DEPLOY (read before adding a remote step) ----
# The host drops SSH connections that arrive in a burst from one address.
# Measured on 2026-09-24: four quick connection rounds from a single IP got
# through, everything after that was refused, and runs #34, #35 and #36 each
# died with ssh exit code 255 on whichever connection happened to be the one
# over the limit — plain retries made it worse, because every retry was one more
# connection. So this workflow opens ONE ssh master connection and multiplexes
# every later ssh / rsync through it (ControlMaster + ControlPersist, see the
# `deploy` host alias written below). Only that first connection is subject to
# the limit, and it is retried with a patient back-off so the host's window can
# clear. If you add a remote step, use the `deploy` alias so it rides the same
# connection — never a fresh `ssh user@host`.

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # adds a manual "Run workflow" button

concurrency:
  group: deploy-englandwaly
  cancel-in-progress: false  # never interrupt a deploy mid-transfer

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Build frontend (dist) ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & build frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE: /api        # same-origin API (works on .com and .online)

      # ---------- SSH: key, the `deploy` alias, the retry helper, ONE master ----------
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Every ssh/rsync below talks to `deploy`: one alias carrying the
          # host, port, user, key, keep-alives and the connection sharing.
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 25
            ServerAliveInterval 20
            ServerAliveCountMax 3
            ControlMaster auto
            ControlPath ~/.ssh/ctl-%C
            ControlPersist 20m
          EOF
          chmod 600 ~/.ssh/config

          # retry <command...>: on failure wait, then try again — waits grow
          # (20 s, 45 s, 90 s, 150 s, 240 s) so a rate-limited host gets a quiet
          # window to forget us instead of being poked every half minute.
          cat > ~/retry.sh <<'EOF'
          retry() {
            local attempt=1 rc
            local waits=(20 45 90 150 240)
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -gt "${#waits[@]}" ]; then
                echo "::error::$1 failed $attempt times (last exit code $rc)"
                return "$rc"
              fi
              local wait=${waits[$((attempt - 1))]}
              echo "attempt $attempt failed (exit code $rc) - retrying in ${wait}s"
              attempt=$((attempt + 1))
              sleep "$wait"
            done
          }
          EOF

          # Open THE connection. -N runs no command, -f backgrounds it once
          # authenticated; ControlPersist keeps it alive across the steps below.
          # Its stdio is detached from this step so the backgrounded master can
          # never hold the step's output pipes open.
          open_master() { ssh -fN deploy </dev/null >/dev/null 2>&1; }
          source ~/retry.sh
          retry open_master
          ssh -O check deploy

      # ---------- Backup the current live version (for rollback) ----------
      # Snapshots the code that this deploy will change (frontend + api_app app
      # code) into ~/englandwaly_backups/. Skips the big/unchanging dirs
      # (vendor, uploads, storage, videos). If this step fails, the job stops
      # BEFORE anything is overwritten — so we never deploy without a safety net.
      - name: Backup current deployment
        run: |
          source ~/retry.sh
          retry ssh deploy "
              set -e
              mkdir -p ~/englandwaly_backups
              STAMP=\$(date +%Y%m%d-%H%M%S)
              tar -czf ~/englandwaly_backups/predeploy.tar.gz \
                -C '$DEPLOY_PATH' \
                --exclude=videos \
                --exclude=api_app/vendor \
                --exclude=api_app/uploads \
                --exclude=api_app/storage \
                .
              cp ~/englandwaly_backups/predeploy.tar.gz ~/englandwaly_backups/backup-\$STAMP.tar.gz
              ls -1t ~/englandwaly_backups/backup-*.tar.gz | tail -n +6 | xargs -r rm -f || true
              echo \"Backup saved: backup-\$STAMP.tar.gz\"
            "

      # ---------- Deploy frontend ----------
      # 1) assets/ is pure build output -> mirror with --delete so old hashed
      #    bundles are cleaned up (safe: assets/ only holds build files).
      # 2) the rest of dist (index.html, the PDFs, images, manifest) -> copy
      #    without --delete, and NEVER touch api/, api_app/ or videos/.
      # --partial keeps what a cut transfer already moved, so a retry resumes
      # the 17 MB of PDFs instead of starting them over.
      - name: Deploy frontend (assets, mirrored)
        run: |
          source ~/retry.sh
          retry rsync -az --delete --partial --timeout=120 \
            dist/assets/ "deploy:$DEPLOY_PATH/assets/"

      - name: Deploy frontend (root files)
        run: |
          source ~/retry.sh
          retry rsync -az --partial --timeout=120 \
            --exclude 'assets/' \
            --exclude 'videos/' \
            dist/ "deploy:$DEPLOY_PATH/"

      # ---------- Deploy backend PHP code (api_app) ----------
      # Ships only app source. Excludes vendor, .env, uploads, storage, cache,
      # public — so Composer deps, secrets, images and runtime state are left
      # exactly as they are on the server. No --delete.
      - name: Deploy backend (api_app)
        run: |
          source ~/retry.sh
          retry rsync -az --partial --timeout=120 \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'vendor/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'public/' \
            --exclude 'uploads/' \
            --exclude 'uploads.zip' \
            --exclude 'storage/' \
            --exclude 'bootstrap/cache/' \
            --exclude 'tests/' \
            --exclude 'node_modules/' \
            --exclude 'database/*.sql' \
            backend_laravel/ "deploy:$DEPLOY_PATH/api_app/"

      # ---------- Post-deploy: clear the Laravel config/route cache ----------
      # (No PHP/Composer/migrations — just drop stale compiled cache so the new
      #  code + existing .env take effect on the next request.)
      - name: Clear config cache
        run: |
          source ~/retry.sh
          retry ssh deploy "rm -f '$DEPLOY_PATH/api_app/bootstrap/cache/'*.php || true"

      # ---------- Auto-rollback if ANY step above failed ----------
      # Restores the pre-deploy snapshot, returning the site to the last working
      # (previous-commit) version. Runs only on failure.
      - name: Roll back on failure
        if: failure()
        run: |
          source ~/retry.sh
          retry ssh deploy "
              if [ -f ~/englandwaly_backups/predeploy.tar.gz ]; then
                echo 'Deploy failed - restoring previous version...'
                tar -xzf ~/englandwaly_backups/predeploy.tar.gz -C '$DEPLOY_PATH'
                rm -f '$DEPLOY_PATH/api_app/bootstrap/cache/'*.php || true
                echo 'Rollback complete - site is back on the previous version.'
              else
                echo 'No backup found; nothing to roll back.'
              fi
            "

      # ---------- Close the shared connection ----------
      - name: Close SSH connection
        if: always()
        run: ssh -O exit deploy 2>/dev/null || true

      - name: Done
        run: echo "Deployed to $DEPLOY_PATH"
